name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows x64 only (ARM64 cross-compile has issues)
          - target: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            output: ipv6-compressor.exe

          # Linux x64 only
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: ipv6-compressor-linux-amd64

          # macOS
          - target: macos-amd64
            os: macos-12
            goos: darwin
            goarch: amd64
            output: ipv6-compressor-macos-amd64
          - target: macos-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            output: ipv6-compressor-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: 安装依赖
      run: |
        go mod tidy
        go mod download

    - name: 安装 Linux 系统依赖
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev libxxf86vm-dev

    - name: 构建可执行文件
      shell: bash
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
      run: |
        if [ "$GOOS" = "windows" ]; then
          go build -ldflags "-H windowsgui" -o ${{ matrix.output }} ./cmd/gui
        else
          go build -o ${{ matrix.output }} ./cmd/gui
        fi

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ipv6-compressor-${{ matrix.target }}
        path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 下载所有构建产物
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: 显示文件结构
      run: |
        ls -R artifacts

    - name: 创建 Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/ipv6-compressor-windows-amd64/ipv6-compressor.exe
          artifacts/ipv6-compressor-linux-amd64/ipv6-compressor-linux-amd64
          artifacts/ipv6-compressor-macos-amd64/ipv6-compressor-macos-amd64
          artifacts/ipv6-compressor-macos-arm64/ipv6-compressor-macos-arm64
        name: IPv6 Compressor ${{ github.ref_name }}
        body: |
          ## IPv6 Compressor ${{ github.ref_name }}

          🎉 正式版本发布

          ### 下载

          | 平台 | 架构 | 文件名 |
          |------|------|--------|
          | Windows | x64 (64位) | ipv6-compressor.exe |
          | Linux | x64 (64位) | ipv6-compressor-linux-amd64 |
          | macOS | Intel (x64) | ipv6-compressor-macos-amd64 |
          | macOS | Apple Silicon (ARM64) | ipv6-compressor-macos-arm64 |

          ### 功能特性

          - 🎨 现代化 GUI 界面
          - 📁 支持 Excel (.xlsx, .xls) 和 CSV 文件
          - 🎯 自动识别 IPv6 地址列
          - 🔧 支持 IPv6 压缩 (RFC 5952)
          - 📋 支持 IPv6 扩展 (完整格式)
          - 🖱️ 拖拽文件上传
          - 📊 实时进度显示
          - 🌏 完整中文界面支持

          ### 使用方法

          1. 下载对应平台的可执行文件
          2. Windows: 直接运行 `.exe` 文件
          3. Linux: 添加执行权限 `chmod +x ipv6-compressor-linux-amd64` 后运行
          4. macOS: 打开 `ipv6-compressor-macos-*` 文件

          ### 系统要求

          - Windows 10/11 (x64)
          - Linux (x64) with glibc
          - macOS 10.15+ (Intel, Apple Silicon)

          ### 更新日志

          #### v2.1.3
          - 🐛 修复 Windows/Linux/macOS 构建问题
          - ✨ 添加自动预发布工作流（每次 push 自动构建）
          - ✨ 自定义可调整大小的文件选择器
          - ✨ 智能输出文件命名（中文后缀：_压缩版/_扩展版）
          - ✨ 自动检测重名文件，添加序号避免覆盖
          - 🖥️ 优化 Windows 窗口大小（适配高 DPI）

          #### v2.1.2
          - 🐛 修复 Preferences API 错误（使用 app.NewWithID）
          - ✨ 增强文件选择过滤器（只显示 .xlsx, .xls, .csv）
          - ✨ 添加默认输出路径自动生成功能
          - ✨ 添加目录记忆功能
          - 🔧 改进错误处理和状态显示

          #### v2.1.1
          - ✨ 新增 IPv6 扩展功能（完整格式）
          - 🐛 修复 Windows 平台控制台窗口问题
          - 🐛 修复文件对话框闪退问题
          - 🐛 修复文件拖拽功能
          - 🔧 升级 Fyne 到 v2.7.4，改善中文显示
          - 📦 支持多平台构建

          #### v2.1.0
          - 🎉 初始 GUI 版本发布
          - 📁 Excel/CSV 文件支持
          - 🎯 自动 IPv6 列检测
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
