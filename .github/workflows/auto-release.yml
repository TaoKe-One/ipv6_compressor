name: Auto Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows x64
          - target: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            output: ipv6-compressor.exe

          # Linux x64
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: ipv6-compressor-linux-amd64

          # macOS Apple Silicon only
          - target: macos-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            output: ipv6-compressor-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置 Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: 安装依赖
      run: |
        go mod tidy
        go mod download

    - name: 安装 Linux 系统依赖
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev libxxf86vm-dev

    - name: 生成版本号
      id: version
      shell: bash
      run: |
        # 获取 commit 数量作为 build 号
        BUILD_NUMBER=$(git rev-list --count HEAD)
        # 获取短 commit hash
        COMMIT_HASH=$(git rev-parse --short HEAD)
        # 生成版本号：v2.1.3-build.{数量}.{hash}
        VERSION="v2.1.3-build.${BUILD_NUMBER}+${COMMIT_HASH}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Build number: $BUILD_NUMBER"
        echo "Commit hash: $COMMIT_HASH"
        echo "Version: $VERSION"

    - name: 构建可执行文件
      shell: bash
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
      run: |
        if [ "$GOOS" = "windows" ]; then
          go build -ldflags "-H windowsgui -s -w" -o ${{ matrix.output }} ./cmd/gui
        else
          go build -ldflags "-s -w" -o ${{ matrix.output }} ./cmd/gui
        fi

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ipv6-compressor-${{ matrix.target }}
        path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 生成版本号
      id: version
      shell: bash
      run: |
        BUILD_NUMBER=$(git rev-list --count HEAD)
        COMMIT_HASH=$(git rev-parse --short HEAD)
        VERSION="v2.1.3-build.${BUILD_NUMBER}+${COMMIT_HASH}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: 下载所有构建产物
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: 显示文件结构
      run: |
        ls -R artifacts

    - name: 创建 Pre-release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/ipv6-compressor-windows-amd64/ipv6-compressor.exe
          artifacts/ipv6-compressor-linux-amd64/ipv6-compressor-linux-amd64
          artifacts/ipv6-compressor-macos-arm64/ipv6-compressor-macos-arm64
        name: IPv6 Compressor ${{ steps.version.outputs.version }}
        body: |
          ## IPv6 Compressor ${{ steps.version.outputs.version }}

          🚀 自动构建版本

          **构建信息：**
          - Commit: ${{ github.sha }}
          - 分支: ${{ github.ref_name }}
          - 构建时间: ${{ github.event.head_commit.timestamp }}

          ### 下载

          | 平台 | 架构 | 文件名 |
          |------|------|--------|
          | Windows | x64 (64位) | ipv6-compressor.exe |
          | Linux | x64 (64位) | ipv6-compressor-linux-amd64 |
          | macOS | Apple Silicon (ARM64) | ipv6-compressor-macos-arm64 |

          ⚠️ 这是自动构建的预发布版本，可能包含未测试的功能。

          如需稳定版本，请查看 [Releases](https://github.com/TaoKe-One/ipv6_compressor/releases) 页面。
        draft: false
        prerelease: true
        tag_name: ${{ steps.version.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
