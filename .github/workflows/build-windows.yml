name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pandas tqdm openpyxl

    - name: 打包 Windows 可执行文件
      run: |
        pyinstaller --onefile --name ipv6_compressor --add-data "ipv6_compressor.py;." ipv6_compressor.py

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ipv6_compressor-windows
        path: dist/ipv6_compressor.exe

    - name: 创建 Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/ipv6_compressor.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
