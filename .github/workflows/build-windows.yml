name: Build Windows

on:
  push:
    branches: [ main, master, v2-dev ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: 安装依赖
      run: |
        go mod tidy
        go mod download

    - name: 构建 Windows 可执行文件
      run: |
        go build -o ipv6-compressor.exe ./cmd/gui

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ipv6-compressor-windows
        path: ipv6-compressor.exe

    - name: 创建 Release (Tag触发)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ipv6-compressor.exe
        name: IPv6 Compressor ${{ github.ref_name }}
        body: |
          ## IPv6 Compressor ${{ github.ref_name }}

          GUI 版本 - Windows x64

          ### 功能
          - 拖拽 Excel/CSV 文件
          - 自动识别 IPv6 列
          - 列选择器
          - 实时进度显示
          - 支持 IPv6 压缩 (RFC 5952) 和扩展 (完整格式) 两种模式
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 创建 Pre-release (Main分支)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        files: ipv6-compressor.exe
        name: IPv6 Compressor (Pre-release)
        tag_name: v2.1.0-pre
        body: |
          ## IPv6 Compressor Pre-release

          这是来自 main 分支的最新构建（自动生成）

          **构建时间**: ${{ github.event.head_commit.timestamp }}
          **提交**: ${{ github.event.head_commit.message }}

          ### 功能
          - 拖拽 Excel/CSV 文件
          - 自动识别 IPv6 列
          - 列选择器
          - 实时进度显示
          - 支持 IPv6 压缩 (RFC 5952) 和扩展 (完整格式) 两种模式

          ⚠️ 这是预发布版本，可能包含未测试的功能
        draft: false
        prerelease: true
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
